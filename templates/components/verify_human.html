{# Cloudflare Turnstile Anti-Bot Verification Component #}
<div class="verify-human-container" style="margin: 16px 0 20px 0;">
    {# Invisible Honeypot Traps - Catch automated scrapers #}
    <div style="opacity: 0; position: absolute; top: 0; left: -9999px; height: 0; width: 0; z-index: -1; pointer-events: none;" aria-hidden="true">
        <label for="website_hp_field">Website URL (leave blank)</label>
        <input type="text" name="website_hp" id="website_hp_field" tabindex="-1" autocomplete="new-password">
        <label for="company_hp_field">Company (leave blank)</label>
        <input type="text" name="company_hp" id="company_hp_field" tabindex="-1" autocomplete="new-password">
    </div>

    {# Time-gated Cryptographic Token #}
    <input type="hidden" name="human_token" value="{{ human_token }}">

    {# Cloudflare Turnstile Widget #}
    <div class="cf-turnstile-wrapper" style="display: flex; justify-content: center; margin: 10px 0;">
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
        <div class="cf-turnstile" data-sitekey="{{ CLOUDFLARE_TURNSTILE_SITE_KEY }}" data-theme="light"></div>
    </div>
</div>
